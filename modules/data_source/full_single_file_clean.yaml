# Layer: full-scale ERA5 data, one file with a row-index warmup/test split.
# warmup_end is required here — it's the only thing that marks where warmup
# stops and the test stream starts in a single combined file.
#
# warmup_path/test_path are explicitly nulled out here: anom_types/clean.yaml
# always sets them (full-scale split files by default), and config merging is
# a plain overwrite, not a delete — without this, they'd silently survive
# alongside data_path and the loader would raise "set either... not both".
data:
  data_path: data/era5/full_scale/raw_files/reanalysis-era5-single-levels-timeseries.csv
  warmup_path: null
  test_path: null
  warmup_start: 0
  warmup_end: 302227
stream: {max_steps: null}
