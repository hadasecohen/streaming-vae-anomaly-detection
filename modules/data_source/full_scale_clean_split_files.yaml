# Layer: full-scale ERA5 clean (no injected anomalies) data, pre-split into
# a warmup-only and a test-only file (each under GitHub's 100MB limit, so
# both can be committed — see DATA_LICENSE.md). No warmup_end here: the
# split point is implicit in which file a row lives in, so the loader
# derives it from the warmup file's row count instead of taking an explicit
# index.
#
# data_path is explicitly nulled out here: an earlier layer (anom_types/*.yaml)
# always sets it to the mini dataset, and config merging is a plain overwrite,
# not a delete — without this, data_path would silently survive alongside
# warmup_path/test_path and the loader would raise "set either... not both".
data:
  data_path: null
  warmup_path: data/era5/full_scale/era5_clean_warmup.csv
  test_path: data/era5/full_scale/era5_clean_test.csv
stream: {max_steps: null}
