# ERA5 mini-dataset — shared base config for the case-study suites in notebooks/cases/.
#
# Data: 210,384 hourly rows (12 years warmup + 12 years test, 50:50), a real ERA5 slice
# centered on the same warmup/test split used at full scale — see DATA_LICENSE.md.
# Swap data_path for the full-scale export to match the thesis's original numbers;
# the qualitative effects in each case hold on this shorter slice too, just with
# wider run-to-run noise.
#
# Layering order (see any notebooks/cases/case*_suite.yaml):
#   era5_common.yaml -> models/era5_{ARCH}.yaml -> anom_types/{type}.yaml
#     -> stream/{point,window}.yaml -> feat_eng/*.yaml (optional) -> run-level config:

common:
  seed: 42
  logging:
    verbosity: INFO_HIGH   # SILENT=0; ERRORS=1; INFO_LOW=2; INFO_HIGH=3; DEBUG=4
  reporting:
    min_eval_samples: 1000
    report_every: 500
    grace_steps: 0

data:
  name: era5
  warmup_start: 0
  warmup_end: 105192       # 12 years hourly — see DATA_LICENSE.md
  args:
    scaler_kind: zscore
    cyclic_time_features: false   # overridden by feat_eng/cyclic_*.yaml layers
    val_ratio: 0.2

model:
  latent_dim: 12
  recon_loss_kind: mse
  prior_variance: 1.0
  clamp_logvar: true
  clamp_bounds: [-4, 4]
  free_bits: 0.5
  pool_latent: true
  pooling: mean
  use_pos_enc: false

training:
  offline_enabled: true
  offline_batch_size: 128
  lr_offline: 5e-4
  lr_online: 5e-5
  weight_decay: 1.0e-4
  elbo_beta: 0.6
  kl_anneal_epochs: 20
  anom_if_score_above: 0.6    # the actual final decision threshold (ensemble_decision)
  update_if_score_below: 0.5  # online-training gate — separate from the decision threshold
  policy: normal_only
  clip_grads_norm: 2.0
  do_kl_normalize: false
  training_loss: elbo
  lambda_variance: 0.5
  hard_threshold_cut: true

  threshold:
    q: 0.95
    buffer_length: 200
    ema: 0.2

  ensemble:
    metric_weights:
      elbo: 0.0
      recon: 0.0
      kl: 0.0
      mah_full_cov: 0.0
      gmm_latent: 0.0
      logvar_sumexp: 0.0
      elbo_w_var: 1.0
      mu_norm: 0.0
      logvar_target_mse: 0.0
