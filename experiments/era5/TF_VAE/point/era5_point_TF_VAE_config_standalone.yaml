
# ERA5 hourly climate reanalysis — TF-VAE, window mode (point anomalies)
#
# Data: 377,784 hourly rows (~17.25 years warmup + ~26.5 years test, 40:60), a real ERA5 slice (see DATA_LICENSE.md).
# Warmup: first ~17.25 years (151,114 rows) — all normal.
# Test:   remaining ~26.5 years (226,670 rows) — contains point anomalies.
#
# warmup_start=133582 matches the standalone tests for LSTM/MLP for point anomaly comparison.

common:
  # device: cpu
  # device: cuda:0
  seed: 42
  logging:
    run_dir: runs/ERA5-point/TF_VAE/standalone
    verbosity: INFO_HIGH
  reporting:
    min_eval_samples: 1000
    report_every: 500
    grace_steps: 0

data:
  name: era5
  data_path: data/era5/mini_50pct/era5_point_rare.csv
  warmup_start: 133582   # last 2 years of warmup only (point-scenario short local training)
  warmup_end:   151114    # 40% of the 377,784-row mini_50pct dataset (see DATA_LICENSE.md)
  args:
    scaler_kind: zscore
    cyclic_time_features: false
    val_ratio: 0.2

model:
  type: "TF_VAE"
  latent_dim: 12
  recon_loss_kind: mse
  pool_latent: true
  pooling: mean
  prior_variance: 1.5
  clamp_logvar: true
  clamp_bounds: [-4, 4]
  free_bits: 0.5
  use_pos_enc: false

  d_model: 64
  num_enc_layers: 4
  num_dec_layers: 4
  nhead: 4
  dropout: 0.1
  activation: gelu
  norm_first: true


training:
  offline_enabled: true
  offline_batch_size: 128
  lr_offline: 5e-4
  lr_online: 5e-5
  weight_decay: 1.0e-4
  elbo_beta: 0.6
  kl_anneal_epochs: 20
  anom_if_score_above: 0.6
  update_if_score_below: 0.5
  policy: normal_only
  clip_grads_norm: 2.0
  do_kl_normalize: false
  training_loss: elbo
  lambda_variance: 0.5
  hard_threshold_cut: true

  threshold:
    q: 0.95
    buffer_length: 200
    ema: 0.2

  ensemble:
    threshold: 0.72
    metric_weights:
      elbo: 0.0
      recon: 1.0
      kl: 0.0
      mah_full_cov: 0.0
      gmm_latent: 0.0
      logvar_sumexp: 0.0
      elbo_w_var: 0.0
      mu_norm: 0.0
      logvar_target_mse: 0.0

stream:
  mode: window
  seq_len: 168
  stride: 24
  shuffle: false
