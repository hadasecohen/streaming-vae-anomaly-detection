
# ERA5 hourly climate reanalysis — TF-VAE, window mode (contextual anomalies)
#
# Data: 105,192 hourly rows (4 years warmup + 8 years test), a real ERA5 slice (see DATA_LICENSE.md).
# Warmup: first 4 years (35 064 rows) — all normal.
# Test:   next  8 years (70,128 rows) — contains contextual anomalies.
#
# cyclic_time_features: true  — sin/cos(doy) + sin/cos(hod) added as input features.
# Longer window (seq_len=336, 2 weeks) helps capture seasonal context.

common:
  # device: cpu
  # device: cuda:0
  seed: 42
  logging:
    run_dir: runs/ERA5-contextual/TF_VAE/standalone
    verbosity: INFO_HIGH
  reporting:
    min_eval_samples: 1000
    report_every: 500
    grace_steps: 0

data:
  name: era5
  data_path: data/era5/era5_contextual_anomalies.csv
  warmup_start: 0
  warmup_end:   35064     # 4 years hourly (see DATA_LICENSE.md)
  args:
    scaler_kind: zscore
    cyclic_time_features: true   # essential for contextual anomaly detection
    val_ratio: 0.2

model:
  type: "TF_VAE"
  latent_dim: 12
  recon_loss_kind: mse
  pool_latent: true
  pooling: mean
  prior_variance: 1.5
  clamp_logvar: true
  clamp_bounds: [-4, 4]
  free_bits: 0.5
  use_pos_enc: false

  d_model: 64
  num_enc_layers: 4
  num_dec_layers: 4
  nhead: 4
  dropout: 0.1
  activation: gelu
  norm_first: true


training:
  offline_enabled: true
  offline_batch_size: 128
  lr_offline: 5e-4
  lr_online: 5e-5
  weight_decay: 1.0e-4
  elbo_beta: 0.6
  kl_anneal_epochs: 20
  anom_if_score_above: 0.6
  update_if_score_below: 0.5
  policy: normal_only
  clip_grads_norm: 2.0
  do_kl_normalize: false
  training_loss: elbo
  lambda_variance: 0.5
  hard_threshold_cut: true

  threshold:
    q: 0.95
    buffer_length: 200
    ema: 0.2

  ensemble:
    threshold: 0.6
    metric_weights:
      elbo: 0.0
      recon: 0.0
      kl: 0.0
      mah_full_cov: 0.0
      gmm_latent: 0.0
      logvar_sumexp: 0.0
      elbo_w_var: 1.0
      mu_norm: 0.0
      logvar_target_mse: 0.0

stream:
  mode: window
  max_steps: 100000
  seq_len: 336      # 2-week window for seasonal context
  stride: 24
  shuffle: false
