common:
  device: cuda:0
  logging:
    run_dir: runs/experiments/finetuned/Group_Transformer
    verbosity: INFO_HIGH
  reporting:
    grace_steps: 0
    min_eval_samples: 1000
    report_every: 500
  seed: 49
data:
  args:
    cyclic_time_features: false
    scaler_kind: zscore
    val_ratio: 0.2
  name: era5
  warmup_path: data/era5/full_scale/split/era5_clean_warmup.csv
  test_path: data/era5/full_scale/split/era5_group_test.csv
model:
  activation: gelu
  clamp_bounds:
  - -4
  - 4
  clamp_logvar: true
  d_model: 96
  dropout: 0.1
  ff_dim: 256
  free_bits: 1.0
  kl_auto_scale: true
  kl_mode: norm
  latent_dim: 8
  nhead: 4
  norm_first: true
  num_dec_layers: 4
  num_enc_layers: 4
  pool_latent: false
  pooling: mean
  prior_variance: 1.5
  recon_loss_kind: mse
  type: TF_VAE
  use_pos_enc: false
stream:
  mode: window
  seq_len: 168
  shuffle: false
  stride: 12
training:
  anom_if_score_above: 0.92
  clip_grads_norm: 2.0
  elbo_beta: 0.1
  ensemble:
    metric_weights:
      elbo: 0.0
      elbo_w_var: 0.0
      gmm_latent: 0.0
      kl: 0.0
      logvar_sumexp: 0.0
      logvar_target_mse: 0.0
      mah_diag: 0.0
      mu_norm: 0.0
      recon: 1.0
  hard_threshold_cut: true
  kl_anneal_epochs: 0
  lambda_variance: 0.5
  lr_offline: 5e-4
  lr_online: 5e-5
  offline_batch_size: 128
  offline_enabled: true
  offline_epochs: 70
  policy: normal_only
  threshold:
    buffer_length: 200
    ema: 0.2
    q: 0.95
  training_loss: elbo
  update_if_score_below: 1.0
  weight_decay: 0.0001
