common:
  device: cuda:0
  logging:
    run_dir: runs/standalone_tests/finetuned/Contextual_LSTM
    verbosity: INFO_HIGH
  reporting:
    grace_steps: 0
    min_eval_samples: 1000
    report_every: 500
  seed: 49
data:
  args:
    cyclic_time_features: false
    scaler_kind: zscore
    val_ratio: 0.2
  name: era5
  warmup_path: data/era5/full_scale/split/era5_clean_warmup.csv
  test_path: data/era5/full_scale/split/era5_contextual_test.csv
model:
  clamp_bounds:
  - -4
  - 4
  clamp_logvar: true
  dec_dropout: 0.0
  dec_hidden_dim: 128
  dec_num_layers: 3
  enc_bidirectional: false
  enc_dropout: 0.1
  enc_hidden_dim: 128
  enc_num_layers: 3
  free_bits: 0.5
  kl_auto_scale: true
  kl_mode: norm
  latent_dim: 56
  pool_latent: false
  pooling: mean
  prior_variance: 1.5
  recon_loss_kind: mse
  type: LSTM
  use_layer_norm: true
  use_pos_enc: false
stream:
  mode: window
  seq_len: 168
  shuffle: false
  stride: 24
training:
  anom_if_score_above: 0.85
  clip_grads_norm: 2.0
  elbo_beta: 0.1
  ensemble:
    metric_weights:
      elbo: 0.0
      elbo_w_var: 0.0
      gmm_latent: 0.0
      kl: 0.0
      logvar_sumexp: 0.0
      logvar_target_mse: 0.0
      mah_diag: 0.0
      mu_norm: 0.0
      recon: 1.0
  hard_threshold_cut: true
  kl_anneal_epochs: 5
  lambda_variance: 0.5
  lr_offline: 5e-4
  lr_online: 5e-5
  offline_batch_size: 128
  offline_enabled: true
  offline_epochs: 70
  policy: normal_only
  threshold:
    buffer_length: 200
    ema: 0.2
    q: 0.95
  training_loss: elbo
  update_if_score_below: 1.0
  weight_decay: 0.0001
