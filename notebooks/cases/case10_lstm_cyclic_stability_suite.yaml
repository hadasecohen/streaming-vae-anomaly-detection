# Case 10 — Cyclic features & stream stability for LSTM-VAE (~ Fig 4.22)
# Group anomalies, window mode. The thesis found that appending cyclic features
# (without reconstructing them) can destabilise a recurrent model's temporal
# representation — worse overall F1, but with a distinctive early-stream dip
# and recovery pattern rather than a uniform decline.
#
# Layering: era5_common -> models/era5_LSTM -> anom_types/group -> stream/window
#           -> feat_eng/{cyclic_off, cyclic_on}

run_module: regression.run_trial
rq: case10_lstm_cyclic_stability
base_config: ../../modules/era5_common.yaml
output_dir: runs/regression/case10_lstm_cyclic_stability

runs:

- name: LSTM_Group_no_cyclic
  model_arch: LSTM
  compare: {anomaly: Group, arch: LSTM, section: cyclic, variant: "off", order: 1}
  config_layers:
  - ../../modules/models/era5_LSTM.yaml
  - ../../modules/anom_types/group.yaml
  - ../../modules/stream/window.yaml
  - ../../modules/feat_eng/cyclic_off.yaml

- name: LSTM_Group_cyclic_input
  model_arch: LSTM
  compare: {anomaly: Group, arch: LSTM, section: cyclic, variant: "on", order: 2}
  config_layers:
  - ../../modules/models/era5_LSTM.yaml
  - ../../modules/anom_types/group.yaml
  - ../../modules/stream/window.yaml
  - ../../modules/feat_eng/cyclic_on.yaml
