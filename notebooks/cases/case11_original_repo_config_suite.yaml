# Case 11 — Original repo config vs thesis-exact config (exploratory, not a thesis figure)
#
# Same Clean-data / MLP-VAE-Cyclic vs Transformer-VAE comparison as Case 1, but run
# under this repo's ORIGINAL (pre-alignment) hyperparameters instead of the
# thesis_code-matching ones era5_common.yaml now carries — see
# modules/original_repo_defaults.yaml for the exact value list. Exists so the two
# configurations can be compared directly (real runs, not just theory) after
# aligning modules/ with thesis_code/tests/regression/modules.
#
# Layering: era5_common -> models/era5_{MLP,TF_VAE} -> anom_types/clean
#           -> stream/window -> feat_eng/cyclic_recon (MLP only)
#           -> original_repo_defaults (reverts to the pre-alignment values)

run_module: regression.run_trial
rq: case11_original_repo_config
base_config: ../../modules/era5_common.yaml
output_dir: runs/regression/case11_original_repo_config

runs:

- name: MLP_Cyclic_Clean
  model_arch: MLP
  compare: {anomaly: Clean, arch: MLP_Cyclic, section: baseline, variant: MLP_Cyclic, order: 1}
  config_layers:
  - ../../modules/models/era5_MLP.yaml
  - ../../modules/anom_types/clean.yaml
  - ../../modules/stream/window.yaml
  - ../../modules/feat_eng/cyclic_recon.yaml
  - ../../modules/original_repo_defaults.yaml
  config:
    plot: {latent_umap: true}

- name: TF_VAE_Clean
  model_arch: TF_VAE
  compare: {anomaly: Clean, arch: TF_VAE, section: baseline, variant: TF_VAE, order: 2}
  config_layers:
  - ../../modules/models/era5_TF_VAE.yaml
  - ../../modules/anom_types/clean.yaml
  - ../../modules/stream/window.yaml
  - ../../modules/original_repo_defaults.yaml
  config:
    plot: {latent_umap: true}
