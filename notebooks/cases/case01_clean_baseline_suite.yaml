# Case 1 — Clean-data false-positive baseline (~ Fig 4.1, 4.2, Table 4.1)
# No injected anomalies: every predicted anomaly is a false positive. Compares
# MLP-VAE-Cyclic against Transformer-VAE to see which architecture starts from
# a calibrated, low false-positive rate vs. an early miscalibration burst.
#
# Unlike every other case notebook, this one runs on the FULL-SCALE real ERA5
# export (755,568 rows), not the mini slice under data/era5/ — same warmup/test
# split (row 302,227, 1974-06-23) and no stream.max_steps cap, exactly matching
# thesis_code/tests/regression/experiments/q0/clean_baseline. This was a
# deliberate choice to reproduce Fig 4.1/4.2/Table 4.1 exactly, at the cost of
# requiring the full-scale source file locally (not included in this repo, not
# Colab-portable — see DATA_LICENSE.md).
#
# Layering: era5_common -> models/era5_{MLP,TF_VAE} -> anom_types/clean
#           -> stream/window -> feat_eng/cyclic_recon (MLP only)
#           -> config: {data: full-scale path/split, stream: {max_steps: null}}

run_module: regression.run_trial
rq: case01_clean_baseline
base_config: ../../modules/era5_common.yaml
output_dir: runs/regression/case01_clean_baseline

runs:

- name: MLP_Cyclic_Clean
  model_arch: MLP
  compare: {anomaly: Clean, arch: MLP_Cyclic, section: baseline, variant: MLP_Cyclic, order: 1}
  config_layers:
  - ../../modules/models/era5_MLP.yaml
  - ../../modules/anom_types/clean.yaml
  - ../../modules/stream/window.yaml
  - ../../modules/feat_eng/cyclic_recon.yaml
  config:
    plot: {latent_umap: true}
    data:
      data_path: /home/cohenhada/thesis_code_data_backup/Datasets/ERA5/reanalysis-era5-single-levels-timeseries.csv
      warmup_start: 0
      warmup_end: 302227
    stream: {max_steps: null}

- name: TF_VAE_Clean
  model_arch: TF_VAE
  compare: {anomaly: Clean, arch: TF_VAE, section: baseline, variant: TF_VAE, order: 2}
  config_layers:
  - ../../modules/models/era5_TF_VAE.yaml
  - ../../modules/anom_types/clean.yaml
  - ../../modules/stream/window.yaml
  config:
    plot: {latent_umap: true}
    data:
      data_path: /home/cohenhada/thesis_code_data_backup/Datasets/ERA5/reanalysis-era5-single-levels-timeseries.csv
      warmup_start: 0
      warmup_end: 302227
    stream: {max_steps: null}
