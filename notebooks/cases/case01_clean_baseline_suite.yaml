# Case 1 — Clean-data false-positive baseline (~ Fig 4.1, 4.2, Table 4.1)
# No injected anomalies: every predicted anomaly is a false positive. Compares
# four architectures — plain MLP-VAE, MLP-VAE-Cyclic, LSTM-VAE, and
# Transformer-VAE — to see which ones start from a calibrated, low
# false-positive rate vs. an early miscalibration burst.
#
# Runs on the FULL-SCALE real ERA5 export (755,568 rows, warmup_end=302227,
# no stream.max_steps cap), exactly matching thesis_code/tests/regression/
# experiments/q0/clean_baseline — a deliberate choice for this comparison:
# testing on the mini 12-year slice showed the opposite FP ordering from the
# thesis (TF_VAE calibrating *better* than MLP-Cyclic), and slicing
# thesis_code's own full run down to the same window count confirmed the
# early-burst effect the thesis describes is already fully present by then —
# so matching warmup length, not just window count, is what reproduces it.
# Requires the full-scale source file locally (data/era5/full_scale/,
# gitignored, not shipped in this repo — see DATA_LICENSE.md); not
# Colab-portable.
#
# Layering: era5_common -> models/era5_{MLP,LSTM,TF_VAE} -> anom_types/clean
#           -> stream/window -> feat_eng/cyclic_recon (MLP_Cyclic only)
#           -> config: {data: full-scale path/split, stream: {max_steps: null}}

run_module: regression.run_trial
rq: case01_clean_baseline
base_config: ../../modules/era5_common.yaml
output_dir: runs/regression/case01_clean_baseline

runs:

- name: MLP_Clean
  model_arch: MLP
  compare: {anomaly: Clean, arch: MLP, section: baseline, variant: MLP, order: 1}
  config_layers:
  - ../../modules/models/era5_MLP.yaml
  - ../../modules/anom_types/clean.yaml
  - ../../modules/stream/window.yaml
  config:
    plot: {latent_umap: true}
    data:
      data_path: data/era5/full_scale/reanalysis-era5-single-levels-timeseries.csv
      warmup_start: 0
      warmup_end: 302227
    stream: {max_steps: null}

- name: MLP_Cyclic_Clean
  model_arch: MLP
  compare: {anomaly: Clean, arch: MLP_Cyclic, section: baseline, variant: MLP_Cyclic, order: 2}
  config_layers:
  - ../../modules/models/era5_MLP.yaml
  - ../../modules/anom_types/clean.yaml
  - ../../modules/stream/window.yaml
  - ../../modules/feat_eng/cyclic_recon.yaml
  config:
    plot: {latent_umap: true}
    data:
      data_path: data/era5/full_scale/reanalysis-era5-single-levels-timeseries.csv
      warmup_start: 0
      warmup_end: 302227
    stream: {max_steps: null}

- name: LSTM_Clean
  model_arch: LSTM
  compare: {anomaly: Clean, arch: LSTM, section: baseline, variant: LSTM, order: 3}
  config_layers:
  - ../../modules/models/era5_LSTM.yaml
  - ../../modules/anom_types/clean.yaml
  - ../../modules/stream/window.yaml
  config:
    plot: {latent_umap: true}
    data:
      data_path: data/era5/full_scale/reanalysis-era5-single-levels-timeseries.csv
      warmup_start: 0
      warmup_end: 302227
    stream: {max_steps: null}

- name: TF_VAE_Clean
  model_arch: TF_VAE
  compare: {anomaly: Clean, arch: TF_VAE, section: baseline, variant: TF_VAE, order: 4}
  config_layers:
  - ../../modules/models/era5_TF_VAE.yaml
  - ../../modules/anom_types/clean.yaml
  - ../../modules/stream/window.yaml
  config:
    plot: {latent_umap: true}
    data:
      data_path: data/era5/full_scale/reanalysis-era5-single-levels-timeseries.csv
      warmup_start: 0
      warmup_end: 302227
    stream: {max_steps: null}
