# Case 3 — Effect of prediction threshold choice (~ thesis section 4.3.1)
# Group anomalies, window mode, LSTM-VAE only. Sweeps the decision threshold
# (anom_if_score_above) across 0.7, 0.8, 0.9, 0.95 to show the
# precision/recall trade-off as the threshold rises: a lower threshold
# flags more anomalies (higher recall, more false positives); a higher
# threshold requires stronger evidence before predicting an anomaly (higher
# precision, more missed anomalies).
#
# Layering: era5_common -> models/era5_LSTM -> anom_types/group
#           -> stream/window -> config: {training: {anom_if_score_above: N}}

run_module: scripts.trial.run_trial
rq: case03_threshold_calibration
base_config: ../../modules/era5_common.yaml
output_dir: runs/regression/case03_threshold_calibration

runs:

- name: LSTM_threshold_0_7
  model_arch: LSTM
  compare: {anomaly: Group, arch: LSTM, section: threshold, variant: "0.7", order: 1}
  config_layers:
  - ../../modules/models/era5_LSTM.yaml
  - ../../modules/anom_types/group.yaml
  - ../../modules/stream/window.yaml
  config: {training: {anom_if_score_above: 0.7}}

- name: LSTM_threshold_0_8
  model_arch: LSTM
  compare: {anomaly: Group, arch: LSTM, section: threshold, variant: "0.8", order: 2}
  config_layers:
  - ../../modules/models/era5_LSTM.yaml
  - ../../modules/anom_types/group.yaml
  - ../../modules/stream/window.yaml
  config: {training: {anom_if_score_above: 0.8}}

- name: LSTM_threshold_0_9
  model_arch: LSTM
  compare: {anomaly: Group, arch: LSTM, section: threshold, variant: "0.9", order: 3}
  config_layers:
  - ../../modules/models/era5_LSTM.yaml
  - ../../modules/anom_types/group.yaml
  - ../../modules/stream/window.yaml
  config: {training: {anom_if_score_above: 0.9}}

- name: LSTM_threshold_0_95
  model_arch: LSTM
  compare: {anomaly: Group, arch: LSTM, section: threshold, variant: "0.95", order: 4}
  config_layers:
  - ../../modules/models/era5_LSTM.yaml
  - ../../modules/anom_types/group.yaml
  - ../../modules/stream/window.yaml
  config: {training: {anom_if_score_above: 0.95}}
