# Case 4 — Latent dimensionality (~ Fig 4.12)
# Contextual anomalies, window mode, no cyclic features (so the model must infer
# seasonal structure from the climate variables alone). MLP-VAE is expected to
# need a much larger bottleneck than LSTM-VAE, whose recurrence already carries
# most of the seasonal trajectory.
#
# Layering: era5_common -> models/era5_{MLP,LSTM} -> anom_types/contextual
#           -> stream/window -> feat_eng/cyclic_off -> config: {model: {latent_dim: N}}

run_module: regression.run_trial
rq: case04_latent_dimension
base_config: ../../modules/era5_common.yaml
output_dir: runs/regression/case04_latent_dimension

runs:

- name: MLP_Z3
  model_arch: MLP
  compare: {anomaly: Contextual, arch: MLP, section: latent_dim, variant: "3", order: 1}
  config_layers:
  - ../../modules/models/era5_MLP.yaml
  - ../../modules/anom_types/contextual.yaml
  - ../../modules/stream/window.yaml
  - ../../modules/feat_eng/cyclic_off.yaml
  config: {model: {latent_dim: 3}}

- name: MLP_Z48
  model_arch: MLP
  compare: {anomaly: Contextual, arch: MLP, section: latent_dim, variant: "48", order: 2}
  config_layers:
  - ../../modules/models/era5_MLP.yaml
  - ../../modules/anom_types/contextual.yaml
  - ../../modules/stream/window.yaml
  - ../../modules/feat_eng/cyclic_off.yaml
  config: {model: {latent_dim: 48}}

- name: LSTM_Z3
  model_arch: LSTM
  compare: {anomaly: Contextual, arch: LSTM, section: latent_dim, variant: "3", order: 3}
  config_layers:
  - ../../modules/models/era5_LSTM.yaml
  - ../../modules/anom_types/contextual.yaml
  - ../../modules/stream/window.yaml
  - ../../modules/feat_eng/cyclic_off.yaml
  config: {model: {latent_dim: 3}}

- name: LSTM_Z48
  model_arch: LSTM
  compare: {anomaly: Contextual, arch: LSTM, section: latent_dim, variant: "48", order: 4}
  config_layers:
  - ../../modules/models/era5_LSTM.yaml
  - ../../modules/anom_types/contextual.yaml
  - ../../modules/stream/window.yaml
  - ../../modules/feat_eng/cyclic_off.yaml
  config: {model: {latent_dim: 48}}
